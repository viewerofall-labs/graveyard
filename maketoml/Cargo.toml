[package]
name = "build-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "build-tool"
path = "src/main.rs"

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
