LABEL arch_nbd
TEXT HELP
Boot the YoMom Linux VQ3 install medium using NBD.
Run yourmom-install to get started.
ENDTEXT
MENU LABEL YoMom Linux VQ3  -  btw I use yo mama (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

LABEL arch_nfs
TEXT HELP
